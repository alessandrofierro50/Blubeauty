# BluBeauty — avvio:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blubeauty_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: blubeauty
      APP_DB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blubeauty_owner -d blubeauty"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api: &backend
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://blubeauty_app:${DB_APP_PASSWORD}@db:5432/blubeauty
      DATABASE_OWNER_URL: postgresql+psycopg://blubeauty_owner:${DB_OWNER_PASSWORD}@db:5432/blubeauty
      REDIS_URL: redis://redis:6379/0
      PUBLIC_URL: https://${SITE_DOMAIN}
      MEDIA_DIR: /data/media
      AGENT_DIR: /agent
    volumes:
      - media:/data/media
      - ./agent:/agent:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: ["api"]

  worker:
    <<: *backend
    command: ["worker"]
    depends_on: [api]

  beat:
    <<: *backend
    command: ["beat"]
    depends_on: [api]

  web:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # dietro un nginx già presente (install.sh lo rileva): Caddy serve in http solo su 127.0.0.1, l'HTTPS lo fa nginx
      CADDY_SITE: ${CADDY_SITE:-${SITE_DOMAIN}}
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
      - "${HTTPS_BIND:-443}:443/udp"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]

volumes:
  media:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
