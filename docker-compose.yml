# Deploy su VPS: docker compose up -d --build
# Richiede un file .env (vedi .env.example) e il DNS di APP_DOMAIN puntato al server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blubeauty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD nel file .env}
      POSTGRES_DB: blubeauty
      TZ: Europe/Rome
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blubeauty"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://blubeauty:${POSTGRES_PASSWORD}@db:5432/blubeauty?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://blubeauty:${POSTGRES_PASSWORD}@db:5432/blubeauty?schema=public
      SESSION_PASSWORD: ${SESSION_PASSWORD:?imposta SESSION_PASSWORD nel file .env}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Reverse proxy con HTTPS automatico (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-blubeauty.blucodeinformatica.it}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
